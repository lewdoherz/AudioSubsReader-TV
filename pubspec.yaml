name: audiosubs_reader
description: "Remote-first ebook and audiobook player for Android TV, including Android 6 ARMv7."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.1 <3.9.0'

dependencies:
  flutter:
    sdk: flutter
  audioplayers: 6.5.1
  audioplayers_android: 5.2.1+tv.1
  path_provider: 2.1.5
  path_provider_android: 2.2.17
  path: 1.9.1
  archive: 4.0.7
  scrollable_positioned_list: 0.3.8

# The API23 OEM start fix is versioned source, not an edit to the pub cache.
dependency_overrides:
  audioplayers_android:
    path: third_party/audioplayers_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/PT_Serif-Web-OFL.txt
    - assets/fonts/PT_Sans-Web-OFL.txt
    - assets/fonts/IBMPlexMono-OFL.txt
    - assets/fonts/SOURCES.txt
  fonts:
    - family: ReaderSerif
      fonts:
        - asset: assets/fonts/PT_Serif-Web-Regular.ttf
        - asset: assets/fonts/PT_Serif-Web-Italic.ttf
          style: italic
        - asset: assets/fonts/PT_Serif-Web-Bold.ttf
          weight: 700
        - asset: assets/fonts/PT_Serif-Web-BoldItalic.ttf
          weight: 700
          style: italic
    - family: ReaderSans
      fonts:
        - asset: assets/fonts/PT_Sans-Web-Regular.ttf
        - asset: assets/fonts/PT_Sans-Web-Italic.ttf
          style: italic
        - asset: assets/fonts/PT_Sans-Web-Bold.ttf
          weight: 700
        - asset: assets/fonts/PT_Sans-Web-BoldItalic.ttf
          weight: 700
          style: italic
    - family: ReaderMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          style: italic
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono-BoldItalic.ttf
          weight: 700
          style: italic
